name: Android CI

# Run once for each source-branch commit; PR open/reopen events provide an initial check.
on:
  push:
    branches: [ "fix/harmony-home-gestures-wallpaper-layout" ]
  pull_request:
    types: [ opened, reopened ]
    branches: [ "main", "fix/launcher-performance-drawer-pages-install", "fix/home-role-gestures-harmony-redesign" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compile baseline profile and macrobenchmark tests
        run: ./gradlew :baselineprofile:assembleAndroidTest --no-daemon --stacktrace

      - name: Build optimized release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Report APK sizes
        shell: bash
        run: |
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          du -h app/build/outputs/apk/debug/app-debug.apk "$RELEASE_APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-launcher-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-launcher-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
